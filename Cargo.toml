[package]
name = "arz_axum_for_bitcoin"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.7"
bitcoincore-rpc = "0.19.0"
chrono = { version = "0.4.42", features = ["serde"] }
clickhouse = "0.14.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
config = "0.15.19"
reqwest = "0.12.24"
ethers = "2.0.14"
futures = "0.3.31"
neo4rs = "0.5"